<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Full Custom Kanban & List Sync</title>
    <!-- Firebase Auth SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <!-- MSAL.js Browser SDK for Graph API logging -->
    <script type="text/javascript" src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
    
    <style>
        :root {
            --primary: #0066cc;
            --primary-hover: #0052a3;
            --danger: #d9534f;
            --bg: #f4f7f6;
            --column-bg: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh;
        }

        /* Authentication UI */
        .auth-container {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; width: 100%;
        }

        .auth-card {
            background: white; padding: 35px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center; max-width: 380px; width: 90%;
        }

        .auth-card h1 { margin-top: 0; color: #1e293b; font-size: 1.6em; }
        .auth-card p { color: #64748b; font-size: 0.9em; margin-bottom: 20px; }

        .form-group-auth { margin-bottom: 12px; text-align: left; }
        .form-group-auth label { font-size: 0.8em; font-weight: bold; color: #475569; display: block; margin-bottom: 4px; }
        .form-group-auth input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }

        .btn-auth {
            padding: 12px; border-radius: 6px; font-weight: bold; font-size: 0.9em;
            cursor: pointer; border: none; width: 100%; box-sizing: border-box;
            background-color: var(--primary); color: white; margin-top: 10px;
        }
        .btn-auth:hover { background-color: var(--primary-hover); }

        .auth-toggle-link {
            margin-top: 15px; font-size: 0.85em; color: #0066cc; cursor: pointer; text-decoration: underline;
        }

        .error-msg { color: #d9381e; font-size: 0.8em; margin-top: 10px; display: none; }

        /* Board UI */
        .board-container { display: none; width: 95%; max-width: 1200px; margin: 20px auto; }
        .board-header { display: flex; justify-content: space-between; align-items: center; background-color: var(--primary); color: white; padding: 15px 25px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .btn-logout { background: rgba(255, 255, 255, 0.2); color: white; border: 1px solid rgba(255, 255, 255, 0.4); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85em; }
        .btn-logout:hover { background: rgba(255, 255, 255, 0.3); }

        .top-action-bar { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .btn-create { background-color: #10b981; color: white; border: none; padding: 12px 22px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95em; }
        .btn-create:hover { background-color: #059669; }

        .board-columns { display: flex; gap: 20px; }
        .column { flex: 1; background-color: var(--column-bg); padding: 15px; border-radius: 8px; min-height: 500px; box-sizing: border-box; }
        .column h3 { margin-top: 0; color: #334155; border-bottom: 2px solid #cbd5e1; padding-bottom: 8px; display: flex; justify-content: space-between; }

        .task-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.06); cursor: grab; }
        .task-card.dragging { opacity: 0.5; transform: scale(0.98); }
        .task-card h4 { margin: 0 0 8px 0; color: #1e293b; font-size: 1em; }
        .task-desc { font-size: 0.85em; color: #475569; margin-bottom: 10px; }
        .task-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8em; color: #64748b; margin: 10px 0; }

        .badge { padding: 3px 8px; border-radius: 4px; font-weight: bold; text-transform: uppercase; font-size: 0.7em; }
        .badge-high { background-color: #ffebe9; color: #d9381e; }
        .badge-medium { background-color: #fff8e6; color: #b7791f; }
        .badge-low { background-color: #e6fffa; color: #234e52; }

        .subtasks-section { background-color: #f8fafc; border-radius: 6px; padding: 8px 10px; margin: 10px 0; border: 1px solid #e2e8f0; }
        .subtasks-title { font-size: 0.75em; font-weight: bold; color: #64748b; margin-bottom: 6px; text-transform: uppercase; }
        .subtask-item { display: flex; align-items: center; gap: 8px; font-size: 0.82em; color: #334155; margin-bottom: 4px; }
        .subtask-item.completed span { text-decoration: line-through; color: #94a3b8; }

        .card-actions { display: flex; gap: 5px; margin-top: 10px; flex-wrap: wrap; }
        .btn-action { background: #f1f5f9; border: 1px solid #cbd5e1; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75em; }
        .btn-edit { background: #e0f2fe; border-color: #7dd3fc; color: #0369a1; }
        .btn-delete { color: var(--danger); border-color: #f87171; background: #fef2f2; margin-left: auto; }

        /* Task Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal { background: white; width: 90%; max-width: 500px; padding: 24px; border-radius: 12px; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.85em; font-weight: bold; color: #475569; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
        
        .subtask-input-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .subtask-input-row input[type="text"] { flex: 1; }
        .btn-remove-sub { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
        .btn-add-sub { background: #e2e8f0; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8em; font-weight: bold; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-secondary { background: #cbd5e1; color: #334155; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Auth View -->
    <div class="auth-container" id="authScreen">
        <div class="auth-card">
            <h1 id="authTitle">Sign In</h1>
            <p id="authSubtitle">Enter your account credentials to access your board.</p>

            <div class="form-group-auth" id="nameGroup" style="display: none;">
                <label>Full Name</label>
                <input type="text" id="authName" placeholder="e.g. Alex Smith">
            </div>

            <div class="form-group-auth">
                <label>Email Address</label>
                <input type="email" id="authEmail" placeholder="user@example.com">
            </div>

            <div class="form-group-auth">
                <label>Password</label>
                <input type="password" id="authPassword" placeholder="••••••••">
            </div>

            <button class="btn-auth" id="btnAuthSubmit" onclick="handleAuthSubmit()">Sign In</button>
            <div class="error-msg" id="authError"></div>

            <div class="auth-toggle-link" id="authToggle" onclick="toggleAuthMode()">
                Don't have an account? Register here
            </div>
        </div>
    </div>

    <!-- Board View -->
    <div class="board-container" id="boardApp">
        <div class="board-header">
            <h2 style="margin: 0;">Task Board</h2>
            <div>
                <span id="activeUserEmail" style="margin-right: 15px; font-size: 0.9em;"></span>
                <button class="btn-logout" onclick="logout()">Sign Out</button>
            </div>
        </div>

        <div class="top-action-bar">
            <button class="btn-create" onclick="openCreateModal()">+ Create New Task</button>
        </div>

        <div class="board-columns">
            <div class="column" ondragover="allowDrop(event)" ondrop="drop(event, 'To Do')">
                <h3>To Do <span id="count-todo">(0)</span></h3>
                <div id="todo-tasks"></div>
            </div>

            <div class="column" ondragover="allowDrop(event)" ondrop="drop(event, 'In Progress')">
                <h3>In Progress <span id="count-inprogress">(0)</span></h3>
                <div id="inprogress-tasks"></div>
            </div>

            <div class="column" ondragover="allowDrop(event)" ondrop="drop(event, 'Completed')">
                <h3>Completed <span id="count-completed">(0)</span></h3>
                <div id="completed-tasks"></div>
            </div>
        </div>
    </div>

    <!-- Modal Popup for Create / Edit -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal">
            <h3 id="modalTitleText">Add New Task</h3>
            <input type="hidden" id="editingTaskId" value="">

            <div class="form-group">
                <label>Task Name</label>
                <input type="text" id="modalTitle" placeholder="e.g. Prepare Presentation">
            </div>

            <div class="form-group">
                <label>Description (Optional)</label>
                <textarea id="modalDesc" rows="2" placeholder="Brief summary..."></textarea>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Priority</label>
                    <select id="modalPriority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Due Date</label>
                    <input type="date" id="modalDueDate">
                </div>
            </div>

            <div class="form-group">
                <label>Sub-Activities / Checklist</label>
                <div id="subtasksListContainer"></div>
                <button type="button" class="btn-add-sub" onclick="addSubtaskField()">+ Add Sub-activity</button>
            </div>

            <div class="modal-actions">
                <button class="btn-secondary" onclick="closeCreateModal()">Cancel</button>
                <button class="btn-create" onclick="saveTaskFromModal()">Save Task</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Firebase Credentials ---
        const firebaseConfig = {
            apiKey: "AIzaSyA7BGHs-siuWVpwVpKW2i_YFnux9knnYsw",
            authDomain: "kanban-board-auth-1f061.firebaseapp.com",
            projectId: "kanban-board-auth-1f061",
            storageBucket: "kanban-board-auth-1f061.firebasestorage.app",
            messagingSenderId: "687037765364",
            appId: "1:687037765364:web:85cc246235d5f0b6e1b0a1",
            measurementId: "G-2C6VYN05BQ"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // --- 2. MSAL Config for Microsoft List Sync ---
        const msalConfig = {
            auth: {
                clientId: "B44847b6-2c51-4888-a9b0-251cd1af998f",
                authority: "https://login.microsoftonline.com/common",
                redirectUri: "https://vng230-dotcom.github.io/Kanban-Board/"
            }
        };
        const MS_LIST_ID = "55818cd3-5188-444e-a368-8836002541c9";
        const msalInstance = new msal.PublicClientApplication(msalConfig);

        let isRegisterMode = false;
        let currentUser = null;
        let tasks = [];

        // --- Auth Toggle & Flow ---
        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            document.getElementById("authTitle").innerText = isRegisterMode ? "Create Account" : "Sign In";
            document.getElementById("authSubtitle").innerText = isRegisterMode ? "Register with your email and password." : "Enter your credentials to continue.";
            document.getElementById("btnAuthSubmit").innerText = isRegisterMode ? "Register" : "Sign In";
            document.getElementById("nameGroup").style.display = isRegisterMode ? "block" : "none";
            document.getElementById("authToggle").innerText = isRegisterMode ? "Already registered? Sign In" : "Don't have an account? Register here";
            hideError();
        }

        async function handleAuthSubmit() {
            hideError();
            const email = document.getElementById("authEmail").value.trim();
            const password = document.getElementById("authPassword").value;
            const name = document.getElementById("authName").value.trim();

            if (!email || !password || (isRegisterMode && !name)) {
                showError("Please fill in all required fields.");
                return;
            }

            try {
                if (isRegisterMode) {
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    await userCredential.user.updateProfile({ displayName: name });
                    currentUser = { name: name, email: email };
                    await logUserToMicrosoftList(currentUser, "Firebase Register");
                } else {
                    const userCredential = await auth.signInWithEmailAndPassword(email, password);
                    currentUser = { name: userCredential.user.displayName || "User", email: email };
                    await logUserToMicrosoftList(currentUser, "Firebase Login");
                }
                showBoardView();
            } catch (err) {
                showError(err.message);
            }
        }

        async function logUserToMicrosoftList(userObj, authType) {
            try {
                let account = msalInstance.getAllAccounts()[0];
                
                // Prompt for Microsoft authentication if no active session
                if (!account) {
                    const loginResponse = await msalInstance.loginPopup({
                        scopes: ["User.Read", "Sites.ReadWrite.All"]
                    });
                    account = loginResponse.account;
                }

                const tokenResponse = await msalInstance.acquireTokenSilent({
                    scopes: ["User.Read", "Sites.ReadWrite.All"],
                    account: account
                });

                const endpoint = `https://graph.microsoft.com/v1.0/me/sites/root/lists/${MS_LIST_ID}/items`;
                
                await fetch(endpoint, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${tokenResponse.accessToken}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        fields: {
                            Title: userObj.name,
                            UserEmail: userObj.email,
                            AuthType: authType
                        }
                    })
                });
            } catch (err) {
                console.warn("Could not log activity to Microsoft List:", err);
            }
        }

        function logout() {
            auth.signOut().then(() => location.reload());
        }

        function showBoardView() {
            document.getElementById("authScreen").style.display = "none";
            document.getElementById("boardApp").style.display = "block";
            document.getElementById("activeUserEmail").innerText = `${currentUser.name} (${currentUser.email})`;
            loadTasks();
            renderBoard();
        }

        function showError(msg) {
            const err = document.getElementById("authError");
            err.innerText = msg; err.style.display = "block";
        }

        function hideError() {
            document.getElementById("authError").style.display = "none";
        }

        // --- Kanban Board Task Mechanics ---
        function loadTasks() {
            const storageKey = `kanban_tasks_${currentUser.email}`;
            const saved = localStorage.getItem(storageKey);
            tasks = saved ? JSON.parse(saved) : [];
        }

        function saveTasks() {
            const storageKey = `kanban_tasks_${currentUser.email}`;
            localStorage.setItem(storageKey, JSON.stringify(tasks));
            renderBoard();
        }

        function openCreateModal() {
            document.getElementById("modalTitleText").innerText = "Add New Task";
            document.getElementById("editingTaskId").value = "";
            document.getElementById("modalTitle").value = "";
            document.getElementById("modalDesc").value = "";
            document.getElementById("modalPriority").value = "medium";
            document.getElementById("modalDueDate").value = "";
            document.getElementById("subtasksListContainer").innerHTML = "";
            addSubtaskField();
            document.getElementById("taskModal").style.display = "flex";
        }

        function openEditModal(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            document.getElementById("modalTitleText").innerText = "Edit Task";
            document.getElementById("editingTaskId").value = task.id;
            document.getElementById("modalTitle").value = task.title;
            document.getElementById("modalDesc").value = task.description || "";
            document.getElementById("modalPriority").value = task.priority;
            document.getElementById("modalDueDate").value = task.dueDate !== "No Due Date" ? task.dueDate : "";

            const container = document.getElementById("subtasksListContainer");
            container.innerHTML = "";

            if (task.subtasks && task.subtasks.length > 0) {
                task.subtasks.forEach(sub => addSubtaskField(sub.title, sub.completed, sub.id));
            } else {
                addSubtaskField();
            }

            document.getElementById("taskModal").style.display = "flex";
        }

        function closeCreateModal() {
            document.getElementById("taskModal").style.display = "none";
        }

        function addSubtaskField(title = "", completed = false, id = null) {
            const container = document.getElementById("subtasksListContainer");
            const div = document.createElement("div");
            div.className = "subtask-input-row";
            const subId = id || Date.now() + Math.random();
            div.innerHTML = `
                <input type="checkbox" class="subtask-status" ${completed ? 'checked' : ''}>
                <input type="text" class="subtask-input" value="${title}" placeholder="Sub-activity detail..." data-id="${subId}">
                <button type="button" class="btn-remove-sub" onclick="this.parentElement.remove()">✕</button>
            `;
            container.appendChild(div);
        }

        function saveTaskFromModal() {
            const editingId = document.getElementById("editingTaskId").value;
            const title = document.getElementById("modalTitle").value.trim();
            const desc = document.getElementById("modalDesc").value.trim();
            const priority = document.getElementById("modalPriority").value;
            const dueDate = document.getElementById("modalDueDate").value || "No Due Date";

            if (!title) {
                alert("Task Name is required!");
                return;
            }

            const subtaskRows = document.querySelectorAll(".subtask-input-row");
            const subtasks = [];
            subtaskRows.forEach((row, idx) => {
                const input = row.querySelector(".subtask-input");
                const checkbox = row.querySelector(".subtask-status");
                if (input.value.trim()) {
                    subtasks.push({
                        id: Number(input.dataset.id) || (Date.now() + idx),
                        title: input.value.trim(),
                        completed: checkbox.checked
                    });
                }
            });

            if (editingId) {
                const taskIndex = tasks.findIndex(t => t.id === Number(editingId));
                if (taskIndex !== -1) {
                    tasks[taskIndex].title = title;
                    tasks[taskIndex].description = desc;
                    tasks[taskIndex].priority = priority;
                    tasks[taskIndex].dueDate = dueDate;
                    tasks[taskIndex].subtasks = subtasks;
                }
            } else {
                tasks.push({
                    id: Date.now(),
                    title: title,
                    description: desc,
                    priority: priority,
                    dueDate: dueDate,
                    status: "To Do",
                    subtasks: subtasks
                });
            }

            saveTasks();
            closeCreateModal();
        }

        function toggleSubtask(taskId, subtaskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task && task.subtasks) {
                const sub = task.subtasks.find(s => s.id === subtaskId);
                if (sub) {
                    sub.completed = !sub.completed;
                    saveTasks();
                }
            }
        }

        function moveTask(id, nextStatus) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.status = nextStatus;
                saveTasks();
            }
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
        }

        // --- Drag and Drop Logic ---
        function drag(event, id) {
            event.dataTransfer.setData("taskId", id);
            event.target.classList.add("dragging");
        }

        function allowDrop(event) {
            event.preventDefault();
        }

        function drop(event, newStatus) {
            event.preventDefault();
            const taskId = event.dataTransfer.getData("taskId");
            if (taskId) moveTask(Number(taskId), newStatus);
        }

        // --- Board Renderer ---
        function renderBoard() {
            const todoContainer = document.getElementById("todo-tasks");
            const inprogressContainer = document.getElementById("inprogress-tasks");
            const completedContainer = document.getElementById("completed-tasks");

            todoContainer.innerHTML = "";
            inprogressContainer.innerHTML = "";
            completedContainer.innerHTML = "";

            let todoCount = 0, inprogressCount = 0, completedCount = 0;

            tasks.forEach(task => {
                const card = document.createElement("div");
                card.className = "task-card";
                card.draggable = true;
                card.ondragstart = (e) => drag(e, task.id);
                card.ondragend = (e) => e.target.classList.remove("dragging");

                let nextButtons = "";
                if (task.status === "To Do") {
                    nextButtons = `<button class="btn-action" onclick="moveTask(${task.id}, 'In Progress')">In Progress →</button>`;
                    todoCount++;
                } else if (task.status === "In Progress") {
                    nextButtons = `
                        <button class="btn-action" onclick="moveTask(${task.id}, 'To Do')">← To Do</button>
                        <button class="btn-action" onclick="moveTask(${task.id}, 'Completed')">Completed →</button>
                    `;
                    inprogressCount++;
                } else if (task.status === "Completed") {
                    nextButtons = `<button class="btn-action" onclick="moveTask(${task.id}, 'In Progress')">← In Progress</button>`;
                    completedCount++;
                }

                let subtasksHTML = "";
                if (task.subtasks && task.subtasks.length > 0) {
                    const completedSubCount = task.subtasks.filter(s => s.completed).length;
                    subtasksHTML = `
                        <div class="subtasks-section">
                            <div class="subtasks-title">Sub-Activities (${completedSubCount}/${task.subtasks.length})</div>
                            ${task.subtasks.map(s => `
                                <div class="subtask-item ${s.completed ? 'completed' : ''}">
                                    <input type="checkbox" ${s.completed ? 'checked' : ''} onclick="toggleSubtask(${task.id}, ${s.id})">
                                    <span>${s.title}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                card.innerHTML = `
                    <h4>${task.title}</h4>
                    ${task.description ? `<div class="task-desc">${task.description}</div>` : ''}
                    <div class="task-meta">
                        <span class="badge badge-${task.priority}">${task.priority}</span>
                        <span>Due: ${task.dueDate}</span>
                    </div>
                    ${subtasksHTML}
                    <div class="card-actions">
                        <button class="btn-action btn-edit" onclick="openEditModal(${task.id})">✎ Edit</button>
                        ${nextButtons}
                        <button class="btn-action btn-delete" onclick="deleteTask(${task.id})">Delete</button>
                    </div>
                `;

                if (task.status === "To Do") todoContainer.appendChild(card);
                else if (task.status === "In Progress") inprogressContainer.appendChild(card);
                else if (task.status === "Completed") completedContainer.appendChild(card);
            });

            document.getElementById("count-todo").innerText = `(${todoCount})`;
            document.getElementById("count-inprogress").innerText = `(${inprogressCount})`;
            document.getElementById("count-completed").innerText = `(${completedCount})`;
        }
    </script>
</body>
</html>
